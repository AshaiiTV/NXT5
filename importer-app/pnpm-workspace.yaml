allowBuilds:
  electron-winstaller: true
overrides:
  # @electron/get v5 uses native fetch and removes the vulnerable got/global-agent chains.
  '@electron/get@3': 5.1.0
  # Build-time HTTP advisories, including GHSA-2m5v-pch6-74hx; keep the patched v6 floor.
  undici@6: ^6.29.1
  # URI normalization advisories (GHSA-w74x-v6f9-j3xg and related), via electron-builder > ajv.
  fast-uri@3: ^3.1.9

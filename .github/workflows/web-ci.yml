name: Web checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      # The hosted runner ships Chrome and its OS dependencies. Avoid an apt
      # download before testing: mirror/DNS outages must not gate browser setup.
      - run: npm run test:layout
        env:
          LAYOUT_BROWSER_CHANNEL: chrome
      - run: node tools/audit-dependencies.mjs

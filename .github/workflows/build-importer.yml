name: Build NXT5 Importer

on:
  pull_request:
    paths:
      - "importer-app/**"
      - ".github/workflows/build-importer.yml"
  push:
    branches: [main]
    paths:
      - "importer-app/**"
      - ".github/workflows/build-importer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-web:
    uses: ./.github/workflows/web-ci.yml

  build-windows:
    name: Windows app
    runs-on: windows-latest
    defaults:
      run:
        working-directory: importer-app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # Pas de cache de dépendances pour les binaires publiés (setup-node v5+ peut l'activer seul).
          package-manager-cache: false

      - name: Install dependencies
        run: |
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=moderate

      - name: Test importer
        run: pnpm test

      - name: Build Windows app
        run: pnpm run dist:win

      - name: Upload Windows app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NXT5-Importer-Windows
          path: importer-app/release/*.exe

  build-mac:
    name: macOS app
    runs-on: macos-latest
    defaults:
      run:
        working-directory: importer-app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # Pas de cache de dépendances pour les binaires publiés (setup-node v5+ peut l'activer seul).
          package-manager-cache: false

      - name: Install dependencies
        run: |
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=moderate

      - name: Test importer
        run: pnpm test

      - name: Build mac app
        run: |
          pnpm run dist:mac
          pnpm run dist:mac:arm

      - name: Package mac apps
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          make_zip() {
            ARCH="$1"
            APP_DIR="release/mac"
            if [ "$ARCH" = "arm64" ]; then
              APP_DIR="release/mac-arm64"
            fi
            APP_PATH="$APP_DIR/NXT5 Importer.app"
            rm -f "release/NXT5-Importer-Mac-${ARCH}-${VERSION}.zip"
            ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "release/NXT5-Importer-Mac-${ARCH}-${VERSION}.zip"
          }
          make_zip x64
          make_zip arm64

      - name: Upload mac app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: NXT5-Importer-macOS
          path: importer-app/release/*.zip

  publish-release:
    name: Publish latest importer release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [verify-web, build-windows, build-mac]
    permissions:
      contents: write
    steps:
      - name: Download built apps
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts

      - name: Publish latest importer release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: nxt5-match-exporter-latest
          name: NXT5 Importer latest
          body: "Dernière version de NXT5 Importer."
          make_latest: true
          overwrite_files: true
          files: release-artifacts/**/*

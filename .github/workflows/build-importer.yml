name: Build NXT5 Importer

on:
  push:
    branches: [main]
    paths:
      - "importer-app/**"
      - ".github/workflows/build-importer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows app
    runs-on: windows-latest
    defaults:
      run:
        working-directory: importer-app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build Windows app
        run: pnpm run dist:win

      - name: Upload Windows app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NXT5-Importer-Windows
          path: importer-app/release/*.exe

  build-mac:
    name: macOS app
    runs-on: macos-latest
    defaults:
      run:
        working-directory: importer-app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build mac app
        run: |
          pnpm run dist:mac
          pnpm run dist:mac:arm

      - name: Package mac apps
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          make_zip() {
            ARCH="$1"
            APP_DIR="release/mac"
            if [ "$ARCH" = "arm64" ]; then
              APP_DIR="release/mac-arm64"
            fi
            APP_PATH="$APP_DIR/NXT5 Importer.app"
            rm -f "release/NXT5-Importer-Mac-${ARCH}-${VERSION}.zip"
            ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "release/NXT5-Importer-Mac-${ARCH}-${VERSION}.zip"
          }
          make_zip x64
          make_zip arm64

      - name: Upload mac app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NXT5-Importer-macOS
          path: importer-app/release/*.zip

  publish-release:
    name: Publish latest importer release
    runs-on: ubuntu-latest
    needs: [build-windows, build-mac]
    permissions:
      contents: write
    steps:
      - name: Download built apps
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts

      - name: Publish latest importer release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: nxt5-match-exporter-latest
          name: NXT5 Importer latest
          body: "Dernière version de NXT5 Importer."
          make_latest: true
          overwrite_files: true
          files: release-artifacts/**/*

name: Build NXT5 Importer

on:
  pull_request:
    paths:
      - "importer-app/**"
      - ".github/workflows/build-importer.yml"
  push:
    branches: [main]
    paths:
      - "importer-app/**"
      - ".github/workflows/build-importer.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-web:
    uses: ./.github/workflows/web-ci.yml

  build-windows:
    name: Windows app
    runs-on: windows-latest
    defaults:
      run:
        working-directory: importer-app
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=moderate

      - name: Test importer
        run: pnpm test

      - name: Build Windows app
        run: pnpm run dist:win

      - name: Upload Windows app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NXT5-Importer-Windows
          path: importer-app/release/*.exe

  build-mac:
    name: macOS app
    runs-on: macos-latest
    timeout-minutes: 60
    outputs:
      release_ready: ${{ steps.signed-mac.outputs.ready }}
    defaults:
      run:
        working-directory: importer-app
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          npm install --global pnpm@11.19.0
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=moderate

      - name: Test importer
        run: pnpm test

      - name: Build mac preview (no Apple credentials)
        if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          # This step has no Apple secrets; only the explicit ad-hoc identity is used.
          CSC_FOR_PULL_REQUEST: "true"
        run: pnpm run dist:mac:preview

      - name: Sign, notarize and verify mac release archives
        id: signed-mac
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::Apple signing secret missing: $name. See importer-app/docs/macos-signing.md."
              exit 1
            fi
          done
          pnpm run dist:mac
          pnpm run dist:mac:arm
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Upload mac app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.signed-mac.outputs.ready == 'true' && 'NXT5-Importer-macOS' || 'NXT5-Importer-macOS-preview' }}
          path: ${{ steps.signed-mac.outputs.ready == 'true' && 'importer-app/release/*.zip' || 'importer-app/release-preview/*.zip' }}
          if-no-files-found: error

  publish-release:
    name: Publish latest importer release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build-mac.outputs.release_ready == 'true'
    runs-on: ubuntu-latest
    needs: [verify-web, build-windows, build-mac]
    permissions:
      contents: write
    steps:
      - name: Download built apps
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts

      - name: Publish latest importer release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: nxt5-match-exporter-latest
          name: NXT5 Importer latest
          body: "Dernière version de NXT5 Importer."
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/NXT5-Importer-Windows/*.exe
            release-artifacts/NXT5-Importer-macOS/*.zip
